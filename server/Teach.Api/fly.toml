# Fly.io: `fly launch --copy-config --no-deploy` в этой папке, затем
# fly volumes create teach_data --size 1
# fly secrets set ANTHROPIC_API_KEY=... Teach__ApiToken=...
# fly deploy
app = "teach-tutor-api"
primary_region = "ams"
# Плавная остановка: после SIGINT воркер дорабатывает текущий урок, Fly ждёт до этого срока перед SIGKILL.
kill_timeout = "160s"

[build]
  dockerfile = "Dockerfile"

[env]
  Teach__Db = "Data Source=/data/teach.db"
  Teach__Model = "auto"

[[mounts]]
  source = "teach_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
